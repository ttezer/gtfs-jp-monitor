# Catalog sync + incremental analysis + semantic reports + GitHub Pages site (data-model §10).
#
# Required configuration (not set yet):
#   secrets.DATA_REPO_TOKEN   fine-grained token, contents: write on ttezer/gtfs-jp-data only
#   vars.GTFS_JP_PROFILE      optional: auto | v3 | v4 (default auto)
name: gtfs-jp-monitor

on:
  schedule:
    - cron: "10 19 * * *" # 04:10 JST daily (GitHub may start scheduled runs late)
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum generations to analyze in this run (backfill batch size)"
        required: false
        default: "400"
      report_limit:
        description: "Maximum semantic change reports to build in this run (newest pairs first)"
        required: false
        default: "3500"
      report_minutes:
        description: "Time budget for the report step, in minutes (no new report starts after it)"
        required: false
        default: "180"
      only:
        description: "Optional ORG_ID/FEED_ID to restrict the run to one feed"
        required: false
        default: ""
      profile:
        description: "GTFS-JP profile for this run"
        type: choice
        options: [auto, v3, v4]
        default: auto

permissions:
  contents: read

concurrency:
  group: gtfs-jp-data-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04 # results must come from x86_64-linux (data-model §6.2)
    timeout-minutes: 330
    env:
      PYTHONPATH: src
      GTFS_JP_PROFILE: ${{ inputs.profile || vars.GTFS_JP_PROFILE || 'auto' }}
      LIMIT: ${{ inputs.limit || '400' }}
      REPORT_LIMIT: ${{ inputs.report_limit || '3500' }}
      REPORT_MINUTES: ${{ inputs.report_minutes || '180' }}
      ONLY: ${{ inputs.only }}
      TRIGGER: ${{ github.event_name }}
    steps:
      - name: Check configuration
        run: |
          case "$GTFS_JP_PROFILE" in
            auto|v3|v4) ;;
            *) echo "::error::GTFS_JP_PROFILE must be auto, v3 or v4"; exit 1 ;;
          esac
          case "$LIMIT" in
            ''|*[!0-9]*) echo "::error::limit must be a positive integer"; exit 1 ;;
          esac
          case "$REPORT_LIMIT" in
            ''|*[!0-9]*) echo "::error::report_limit must be a positive integer"; exit 1 ;;
          esac
          case "$REPORT_MINUTES" in
            ''|*[!0-9]*) echo "::error::report_minutes must be a positive integer"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install --quiet "jsonschema>=4.18"
          python -m unittest discover -t . -s tests

      - name: Check out data repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ttezer/gtfs-jp-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Install pinned GTFS Analyzer
        run: python -m gtfs_jp_monitor install-analyzer --dest "$RUNNER_TEMP/analyzer"

      - name: Sync catalog
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python -m gtfs_jp_monitor sync-catalog --data-dir data --events-out "$RUNNER_TEMP/catalog-events.json" "${args[@]}"

      - name: Analyze new generations
        run: |
          args=(--limit "$LIMIT")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          case "$TRIGGER" in schedule|workflow_dispatch) ;; *) TRIGGER=local ;; esac
          python -m gtfs_jp_monitor analyze --data-dir data \
            --analyzer "$RUNNER_TEMP/analyzer/gtfs-analyzer" \
            --profile "$GTFS_JP_PROFILE" --trigger "$TRIGGER" \
            --extra-warnings "$RUNNER_TEMP/catalog-events.json" "${args[@]}"

      - name: Build semantic change reports
        run: |
          args=(--limit "$REPORT_LIMIT" --max-minutes "$REPORT_MINUTES")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python -m gtfs_jp_monitor semantic-reports --data-dir data --profile "$GTFS_JP_PROFILE" "${args[@]}"

      - name: Commit and push data
        working-directory: data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "gtfs-jp-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update monitoring data (${GITHUB_RUN_ID})"
          if ! git push -q; then
            git pull -q --rebase
            git push -q
          fi

      # The public site is rebuilt from the data repository after every run.
      - name: Build web site
        run: |
          release=$(python -c 'import json; print(json.load(open("analyzer.lock.json"))["release_tag"])')
          python -m gtfs_jp_monitor export-web --data-dir data --release-tag "$release" --profile "$GTFS_JP_PROFILE" \
            --analyzer "$RUNNER_TEMP/analyzer/gtfs-analyzer" --html _site/index.html --bundle-format gz

      # Sizes go to the job summary; past 75% of a budget the step warns (data-model §10.2).
      - name: Check storage
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          args=()
          if kb=$(gh api repos/ttezer/gtfs-jp-data --jq .size); then args+=(--repo-kb "$kb"); fi
          python -m gtfs_jp_monitor check-storage --status _site/status.json "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  pages:
    needs: monitor
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
