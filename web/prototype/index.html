<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTFS-JP Monitor</title>
<meta name="description" content="Feed quality, publication readiness and change history for gtfs-data.jp feeds">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --ground: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #eef3f1;
  --ink: #16201c;
  --muted: #5b6a64;
  --faint: #8a9892;
  --hair: #dbe3e0;
  --accent: #0f5c6e;
  --accent-soft: #dcecef;
  --good: #1f7a45;
  --good-soft: #e0f2e7;
  --warn: #9a6512;
  --warn-soft: #fbefd9;
  --bad: #b3372a;
  --bad-soft: #f9e2de;
  --spark: #0f5c6e;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f1513; --surface: #161f1c; --surface-2: #1c2723; --ink: #e5ede9; --muted: #9aa8a2;
    --faint: #6f7d77; --hair: #2a3632; --accent: #5bb6c9; --accent-soft: #173a42; --good: #5cc98a;
    --good-soft: #163324; --warn: #e2ad55; --warn-soft: #3a2c14; --bad: #ef7f71; --bad-soft: #3d1c18; --spark: #5bb6c9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1513; --surface: #161f1c; --surface-2: #1c2723; --ink: #e5ede9; --muted: #9aa8a2;
  --faint: #6f7d77; --hair: #2a3632; --accent: #5bb6c9; --accent-soft: #173a42; --good: #5cc98a;
  --good-soft: #163324; --warn: #e2ad55; --warn-soft: #3a2c14; --bad: #ef7f71; --bad-soft: #3d1c18; --spark: #5bb6c9;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); }
.langs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.notice { margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--ink);
  border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.notice b { color: var(--warn); }

nav.tabs { margin-top: 18px; display: flex; gap: 4px; border-bottom: 1px solid var(--hair); overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.filters { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: grid; gap: 3px; }
.field label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.field input, .field select { background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; padding: 7px 10px; min-width: 0; }
.field.grow { flex: 1 1 220px; }
.toggle { display: flex; gap: 8px; align-items: center; padding-bottom: 7px; cursor: pointer; color: var(--muted); }
.count { margin-left: auto; padding-bottom: 7px; color: var(--muted); }

.layout { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.layout > * { min-width: 0; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); }

table.grid { border-collapse: collapse; width: 100%; min-width: 780px; }
table.grid th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
table.grid th.gen { text-align: center; }
table.grid th.now { color: var(--accent); font-weight: 700; }
table.grid td { padding: 8px 6px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
table.grid td.pickable { cursor: pointer; border-radius: 6px; }
table.grid td.pickable:hover { box-shadow: inset 0 0 0 1px var(--accent); }
table.grid td.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface) !important; }
table.grid tr.feed { cursor: pointer; }
table.grid tr.feed:hover td { background: var(--surface-2); }
table.grid tr.feed[aria-selected="true"] td { background: var(--accent-soft); }
table.grid tr.feed[aria-selected="true"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.fname { font-weight: 700; font-size: 15px; }
.fsub { color: var(--muted); font-size: 12px; }
.fcell { display: grid; gap: 4px; max-width: 220px; }

.gcell { display: grid; gap: 3px; justify-items: center; min-width: 92px; }
.gdate { font-size: 11px; color: var(--faint); }
.pair { display: grid; grid-template-columns: auto auto; gap: 2px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.badge { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; padding: 1px 7px; border-radius: 5px; text-align: center; min-width: 44px; }
.b-good { background: var(--good-soft); color: var(--good); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-none { background: var(--surface-2); color: var(--faint); }
.fatal { font-size: 11px; color: var(--bad); font-weight: 700; }
.merged { font-size: 10px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 6px; }

.dcell { font-size: 12px; line-height: 1.35; min-width: 84px; }
.dcell .arrow { font-family: var(--mono); font-weight: 600; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--faint); }
.chip { display: inline-block; font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--surface-2); color: var(--muted); }
.chip.next { background: var(--accent-soft); color: var(--accent); border: 0; cursor: pointer; font: inherit; font-size: 11px; }
.chip.next.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.chip.disc { background: var(--surface-2); color: var(--muted); }
tr.feed.disc td > * { opacity: .55; }
tr.orghead td { background: var(--surface-2); padding: 6px 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
tr.orghead td .n { font-weight: 400; color: var(--muted); margin-left: 6px; }
tr.orghead td .caret { display: inline-block; width: 1em; color: var(--muted); }
tr.feed.child td:first-child { padding-left: 22px; }
.fmt { font-size: 11px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 8px; }

aside.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px; display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 1100px) { aside.panel { position: static; max-height: none; overflow: visible; } }
.ph { display: grid; gap: 4px; }
.ph h2 { margin: 0; font-size: 20px; }
.ph .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.state { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; width: fit-content; }
.state.ok { background: var(--good-soft); color: var(--good); }
.state.no { background: var(--bad-soft); color: var(--bad); }
.pick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.pick .field select { width: 100%; }
.pick .to { padding-bottom: 8px; color: var(--faint); }
.hint { font-size: 12px; color: var(--muted); }
h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
h3 small { font-weight: 400; color: var(--faint); font-size: 12px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 480px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { border: 1px solid var(--hair); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; }
.card .k { font-size: 12px; color: var(--muted); }
.card .v { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 6px; }
.card .v span:first-child { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
.card .d { font-family: var(--mono); font-size: 12px; font-weight: 600; }
svg.spark { width: 100%; height: 26px; display: block; }

table.mini { border-collapse: collapse; width: 100%; font-size: 12px; }
table.mini th { text-align: left; font-weight: 500; color: var(--faint); padding: 5px 6px; border-bottom: 1px solid var(--hair); }
table.mini td { padding: 5px 6px; border-bottom: 1px solid var(--hair); vertical-align: top; }
table.mini td.r, table.mini th.r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sev { font-size: 10px; font-weight: 700; letter-spacing: .04em; border-radius: 4px; padding: 0 5px; }
.sev-CRITICAL, .sev-HIGH { background: var(--bad-soft); color: var(--bad); }
.sev-MEDIUM { background: var(--warn-soft); color: var(--warn); }
.sev-LOW, .sev-INFO { background: var(--surface-2); color: var(--muted); }
.bucket td { background: var(--surface-2); font-weight: 700; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.empty { border: 1px dashed var(--hair); border-radius: 6px; padding: 12px; color: var(--muted); font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }
.section { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px; margin-top: 14px; }
.section p { max-width: 70ch; margin: 0 0 8px; }
footer { margin-top: 24px; color: var(--faint); font-size: 12px; }
.rp { display: grid; gap: 16px; }
.rp > *, .rp .lb > *, .rp .lines > *, .rp details { min-width: 0; }
.rp h2 { margin: 0; font-size: 20px; }
.rp h3 { margin: 0 0 8px; }
.rp .pubs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
.rp .pub { border: 1px solid var(--hair); border-radius: 6px; padding: 8px 10px; font-size: 12px; display: grid; gap: 2px; }
.rp .pub b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.rp .memo { color: var(--muted); white-space: pre-line; max-height: 5.5em; overflow: auto; }
.covbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.covbar span { display: block; height: 100%; }
.cov-e { background: var(--good); } .cov-o { background: var(--faint); } .cov-u { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.st { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.st-added { background: var(--good-soft); color: var(--good); }
.st-discontinued, .st-removed { background: var(--bad-soft); color: var(--bad); }
.st-renamed, .st-moved, .st-renamed_moved, .st-merged, .st-split, .st-restructured, .st-changed { background: var(--warn-soft); color: var(--warn); }
.st-unchanged { background: var(--surface-2); color: var(--muted); }
details.line { border: 1px solid var(--hair); border-radius: 6px; }
details.line > summary { cursor: pointer; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
details.line > summary .ln { font-weight: 700; }
details.line > summary .lt { color: var(--muted); font-size: 12px; font-family: var(--mono); }
details.line[open] > summary { border-bottom: 1px solid var(--hair); }
details.line .lb { padding: 10px; display: grid; gap: 12px; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 6px; padding: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 5px; padding: 3px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.ttbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
table.tt { border-collapse: collapse; font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.tt th, table.tt td { border-bottom: 1px solid var(--hair); padding: 3px 6px; text-align: right; white-space: nowrap; }
table.tt th { color: var(--faint); font-weight: 500; }
table.tt th.pl, table.tt td.pl { text-align: left; font-family: var(--font); position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 16em; overflow: hidden; text-overflow: ellipsis; }
table.tt td s, .tt-rem { color: var(--bad); }
table.tt td b, .tt-add { color: var(--good); font-weight: 600; }
table.tt td.add { background: var(--good-soft); }
table.tt td.rem { background: var(--bad-soft); }
table.tt td.chg { background: var(--warn-soft); }
table.tt tr.only-new td.pl { color: var(--good); }
table.tt tr.only-old td.pl { color: var(--bad); }
.edits { margin: 0; padding-left: 18px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-family: var(--mono); font-size: 13px; }
.pmap { position: relative; height: 380px; overflow: hidden; border: 1px solid var(--hair); border-radius: 6px; background: var(--surface-2); touch-action: none; cursor: grab; user-select: none; }
.pmap .tiles img { position: absolute; width: 256px; height: 256px; pointer-events: none; }
.pmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pmap .mapctl { position: absolute; top: 8px; right: 8px; display: grid; gap: 4px; }
.pmap .mapctl button { border: 1px solid var(--hair); background: var(--surface); border-radius: 5px; min-width: 30px; padding: 3px 8px; cursor: pointer; font-size: 13px; }
.pmap .attr { position: absolute; right: 4px; bottom: 2px; font-size: 10px; background: rgb(255 255 255 / .75); color: #333; padding: 0 4px; border-radius: 3px; }
.pmap .attr a { color: inherit; }
#reports tr[data-place] { cursor: pointer; }
#reports tr[data-place]:hover td { background: var(--surface-2); }
details.other > summary { cursor: pointer; }
.dval { font-family: var(--mono); font-size: 11px; word-break: break-all; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>GTFS-JP Monitor</h1>
      <p id="tagline"></p>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="tr">TR</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ja">JA</button>
    </div>
  </header>
  <div class="notice" id="notice"></div>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="overview"></button>
    <button type="button" role="tab" data-tab="history"></button>
    <button type="button" role="tab" data-tab="reports"></button>
    <button type="button" role="tab" data-tab="gtfsjp"></button>
  </nav>

  <section id="tab-overview">
    <div class="filters">
      <div class="field grow"><label for="q" data-t="search"></label><input id="q" type="search" autocomplete="off"></div>
      <div class="field"><label for="pref" data-t="prefecture"></label><select id="pref"></select></div>
      <div class="field"><label for="org" data-t="organization"></label><select id="org"></select></div>
      <div class="field"><label for="feedsel" data-t="feedPick"></label><select id="feedsel"></select></div>
      <div class="field"><label for="pub" data-t="readiness"></label><select id="pub"></select></div>
      <div class="field"><label for="sort" data-t="sort"></label><select id="sort"></select></div>
      <label class="toggle"><input id="merge" type="checkbox" checked> <span data-t="merge"></span></label>
      <label class="toggle"><input id="showdisc" type="checkbox" checked> <span data-t="showDisc"></span></label>
      <div class="count" id="count"></div>
    </div>
    <p class="hint" id="merge-note"></p>
    <div class="layout">
      <div class="scroll"><table class="grid" id="grid"></table></div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>

  <section id="tab-history" hidden>
    <div class="section" id="history"></div>
  </section>
  <section id="tab-reports" hidden><div class="section" id="reports"></div></section>
  <section id="tab-gtfsjp" hidden><div class="section" id="gtfsjp"></div></section>

  <footer id="footer"></footer>
</div>

<script id="export-data" type="application/json">/*__EXPORT__*/</script>
<script>
(() => {

const PREFS = [["北海道","Hokkaido"],["青森県","Aomori"],["岩手県","Iwate"],["宮城県","Miyagi"],["秋田県","Akita"],["山形県","Yamagata"],["福島県","Fukushima"],["茨城県","Ibaraki"],["栃木県","Tochigi"],["群馬県","Gunma"],["埼玉県","Saitama"],["千葉県","Chiba"],["東京都","Tokyo"],["神奈川県","Kanagawa"],["新潟県","Niigata"],["富山県","Toyama"],["石川県","Ishikawa"],["福井県","Fukui"],["山梨県","Yamanashi"],["長野県","Nagano"],["岐阜県","Gifu"],["静岡県","Shizuoka"],["愛知県","Aichi"],["三重県","Mie"],["滋賀県","Shiga"],["京都府","Kyoto"],["大阪府","Osaka"],["兵庫県","Hyogo"],["奈良県","Nara"],["和歌山県","Wakayama"],["鳥取県","Tottori"],["島根県","Shimane"],["岡山県","Okayama"],["広島県","Hiroshima"],["山口県","Yamaguchi"],["徳島県","Tokushima"],["香川県","Kagawa"],["愛媛県","Ehime"],["高知県","Kochi"],["福岡県","Fukuoka"],["佐賀県","Saga"],["長崎県","Nagasaki"],["熊本県","Kumamoto"],["大分県","Oita"],["宮崎県","Miyazaki"],["鹿児島県","Kagoshima"],["沖縄県","Okinawa"]];

const T = {
  tr: {
    tagline: "Feed kalitesi, yayına hazırlık ve değişiklik geçmişi",
    notice: (f, g, rel, prof) => `<b>Önizleme.</b> ${f} feed, ${g} yayın; GTFS Analyzer ${rel} (${prof} profili). Şimdilik her feed'in son 4 yayını analiz edildi; daha eski yayınlar her gün arka planda ekleniyor. Semantic değişiklik raporları her gün en yeni yayın çiftlerinden başlayarak ekleniyor (Diff Raporları sekmesi).`,

    sortRecent: "Son yayın (yeniden eskiye)", sortName: "Ad", sortLow: "Overall (düşükten)", sortHigh: "Overall (yüksekten)",
    feeds: n => `Toplam ${n} feed`, feed: "Feed",
    prev: n => `${n} önceki`, current: "Güncel", delta: "Δ",
    noChange: "±0 değişiklik yok", routes: "hat", stops: "durak", trips: "sefer",
    fixed: n => `${n} kural düzeldi`, newRules: n => `${n} yeni kural`,
    nextChip: (n, d) => `Sonraki: ${d}${n > 1 ? ` (+${n - 1})` : ""} · karşılaştır`, clickNext: "Güncel ile yaklaşan yayını karşılaştır", jpFiles: "JP dosyaları", formatDiff: (a, b) => `Biçim farkı: eski yayındaki JP dosyaları [${a}], yenideki [${b}]. Kural farklarının bir kısmı hizmet değişikliğinden değil biçim değişikliğinden kaynaklanabilir.`, mergedChip: n => `×${n} yayın`,

const rt = (k, ...a) => { const v = R[state.lang][k]; return typeof v === "function" ? v(...a) : v; };
const DAYS = ["weekday", "saturday", "sunday_holiday"];
const hm = m => m == null ? "" : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
state.openLines = new Set(); state.tt = {};

// Report of two neighbouring groups: old = last member of the older group, new = first member of the newer one.
// Reports are indexed in the page and loaded per prefecture bundle when first needed.
const REPORTS = DATA.report_index || {};
const bundles = new Map();
function loadBundle(name) {
  if (!bundles.has(name)) {
    const p = fetch(`reports/${name}${DATA.report_bundle_ext || ".json.gz"}`).then(async r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const buf = new Uint8Array(await r.arrayBuffer());
      // Some servers already decode gzip (Content-Encoding); only decompress real gzip bytes.
      const text = buf[0] === 0x1f && buf[1] === 0x8b
        ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
        : new TextDecoder().decode(buf);
      return JSON.parse(text);
    });
    p.catch(() => bundles.delete(name));
    bundles.set(name, p);
  }
  return bundles.get(name);
}
function pairReport(gs, lo, hi) {
  if (Math.abs(lo - hi) !== 1) return { adjacent: false, pair: null, entry: null };
  const [o, n] = lo < hi ? [gs[lo], gs[hi]] : [gs[hi], gs[lo]];
  const k = `${o.rep.uid}__${n.members[0].uid}`;
  return { adjacent: true, pair: k, entry: REPORTS[k] || null };
}
function selectedReport() {
  const f = DATA.feeds.find(x => key(x) === state.selected);
  if (!f || state.oldIdx == null || state.newIdx == null) return { f, adjacent: false, pair: null, entry: null };
  const gs = groups(f);
  return { f, backwards: state.oldIdx > state.newIdx, ...pairReport(gs, state.oldIdx, state.newIdx) };
}

function panelSemantic() {
  const { adjacent, entry } = selectedReport();
  if (!adjacent) return `<p class="hint">${esc(rt("panelNotAdjacent"))}</p>`;
  if (!entry) return `<div class="empty">${esc(rt("panelNone"))}</div>`;
  const s = entry.summary, c = entry.coverage;
  const pct = c.raw_total ? Math.floor(c.explained / c.raw_total * 1000) / 10 : 100;
  const trips = DAYS.filter(d => s.trips_by_day_type[d]).map(d => {
    const x = s.trips_by_day_type[d], dv = x.after - x.before;
    return `<tr><td>${esc(rt("dt")[d])}</td><td class="r">${x.before}</td><td class="r">${x.after}</td><td class="r ${dv > 0 ? "up" : dv < 0 ? "down" : "flat"}">${signed(dv)}</td></tr>`;
  }).join("");
  return `<p class="hint">${esc(rt("panelLines", s.lines))}<br>${esc(rt("panelPlaces", s.places))}<br>${esc(rt("panelCov", pct))}</p>
    <table class="mini"><thead><tr><th>${esc(rt("trips"))}</th><th class="r">${esc(t("before"))}</th><th class="r">${esc(t("after"))}</th><th class="r">Δ</th></tr></thead><tbody>${trips}</tbody></table>
    <p><button type="button" class="linkbtn" id="open-report">${esc(rt("panelOpen"))}</button></p>`;
}

const pname = (rep, i) => { const p = rep.places[i]; return p ? (p.new || p.old).name : "?"; };
const stChip = (cls, text) => `<span class="st st-${esc(cls)}">${esc(text)}</span>`;

function dirLabel(rep, line, dir) {
  const tab = line.timetables.find(x => x.direction === dir);
  const side = tab && (tab.new || tab.old);
  if (side && side.places.length) return `${pname(rep, side.places[0])} → ${pname(rep, side.places[side.places.length - 1])}`;
  return `${rt("dir")} ${dir}`;
}

// Longest common subsequence merge of two place-index rows.
function mergeRows(A, B) {
  const n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) out.push({ p: A[i], io: i++, in: j++ });
    else if (L[i + 1][j] >= L[i][j + 1]) out.push({ p: A[i], io: i++, in: null });
    else out.push({ p: B[j], io: null, in: j++ });
  }
  while (i < n) out.push({ p: A[i], io: i++, in: null });
  while (j < m) out.push({ p: B[j], io: null, in: j++ });
  return out;
}

const firstTime = times => times.find(x => x != null);

function ttHtml(rep, tab, view) {
  if (view !== "diff") {
    const side = tab[view];
    if (!side) return `<p class="hint">${esc(rt("noTT"))}</p>`;
    const head = side.trips.map(tr => `<th title="${esc(tr.trip_id)}">${hm(firstTime(tr.times))}</th>`).join("");
    const rows = side.places.map((p, r) => `<tr><td class="pl" title="${esc(pname(rep, p))}">${esc(pname(rep, p))}</td>${side.trips.map(tr => `<td>${hm(tr.times[r])}</td>`).join("")}</tr>`).join("");
    return `<div class="scroll"><table class="tt"><thead><tr><th class="pl"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const O = tab.old || { places: [], trips: [] }, N = tab.new || { places: [], trips: [] };
  const rows = mergeRows(O.places, N.places);
  const cols = tab.pairs.map(([o, n]) => {
    const a = o == null ? null : O.trips[o], b = n == null ? null : N.trips[n];
    const cells = rows.map(r => ({ x: a && r.io != null ? a.times[r.io] : null, y: b && r.in != null ? b.times[r.in] : null }));
    const kind = !a ? "add" : !b ? "rem" : cells.some(c => c.x !== c.y) ? "chg" : "";
    return { a, b, cells, kind };
  });
  const head = cols.map(c => {
    const tt = c.b ? firstTime(c.b.times) : firstTime(c.a.times);
    const mark = c.kind === "add" ? "+" : c.kind === "rem" ? "−" : c.kind === "chg" ? "~" : "";
    const title = [c.a && c.a.trip_id, c.b && c.b.trip_id].filter(Boolean).join(" → ");
    return `<th title="${esc(title)}">${mark}${hm(tt)}</th>`;
  }).join("");
  const body = rows.map((r, ri) => {
    const cls = r.io == null ? "only-new" : r.in == null ? "only-old" : "";
    const tds = cols.map(c => {
      const { x, y } = c.cells[ri];
      let v;
      if (c.kind === "rem") v = x == null ? "" : `<s>${hm(x)}</s>`;
      else if (c.kind === "add") v = y == null ? "" : hm(y);
      else if (x === y) v = hm(y);
      else v = `${y == null ? "" : `<b>${hm(y)}</b>`}${x == null ? "" : ` <s>${hm(x)}</s>`}`;
      return `<td class="${c.kind}">${v}</td>`;
    }).join("");
    return `<tr class="${cls}"><td class="pl" title="${esc(pname(rep, r.p))}">${esc(pname(rep, r.p))}</td>${tds}</tr>`;
  }).join("");
  return `<div class="scroll"><table class="tt"><thead><tr><th class="pl"></th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function lineNames(line) {
  const o = line.old ? line.old.names.join(" / ") : "", n = line.new ? line.new.names.join(" / ") : "";
  return o && n && o !== n ? `${o} → ${n}` : n || o;
}

const lastTime = times => { for (let i = times.length - 1; i >= 0; i--) if (times[i] != null) return times[i]; return null; };
const stops = (side, trip) => side.places.map((p, i) => [p, trip.times[i]]).filter(x => x[1] != null);
function tableOf(rep, lineKey, dir, dt) {
  const l = rep.lines.find(x => x.key === lineKey);
  return l && l.timetables.find(t => t.direction === dir && t.day_type === dt);
}
function lineLabel(rep, k) { const l = rep.lines.find(x => x.key === k); return l ? lineNames(l) : k; }
function editText(rep, e) {
  const names = e.places.map(i => pname(rep, i));
  const where = names.length > 3 ? `${names[0]} … ${names[names.length - 1]} (${names.length})` : names.join(" → ");
  return `${rt("ek")[e.kind]}: ${where}`;
}

// Every trip that changed in this line, one row each (the difference view as a list).
function tripChanges(rep, line) {
  const rows = [];
  for (const t of line.timetables) {
    const O = t.old, N = t.new;
    for (const [o, n] of t.pairs) {
      const a = o == null ? null : O.trips[o], b = n == null ? null : N.trips[n];
      let kind, oldTrip = a, newTrip = b, note = "", sortDir = t.direction;
      if (a && b) {
        const x = stops(O, a), y = stops(N, b);
        if (JSON.stringify(x) === JSON.stringify(y)) continue;
        const samePlaces = JSON.stringify(x.map(s => s[0])) === JSON.stringify(y.map(s => s[0]));
        const shared = new Map(y.map(s => [s[0], s[1]]));
        const sameTimes = x.every(s => !shared.has(s[0]) || shared.get(s[0]) === s[1]);
        kind = samePlaces ? "retimed" : sameTimes ? "rerouted" : "retimed_rerouted";
      } else {
        const side = a ? "old" : "new", idx = a ? o : n;
        const m = rep.moves.find(m => m.day_type === t.day_type && m[side].line === line.key && m[side].direction === t.direction && m[side].trip === idx);
        if (m) {
          const other = a ? "new" : "old";
          const ot = tableOf(rep, m[other].line, m[other].direction, t.day_type);
          const trip = ot && ot[other] && ot[other].trips[m[other].trip];
          if (m.old.line === m.new.line && a == null) continue;  // shown once, from the old side
          if (a) newTrip = trip; else oldTrip = trip;
          const edits = m.edits.map(e => editText(rep, e)).join("; ");
          if (m.old.line === m.new.line) { kind = m.kind === "exact" ? "moved_dir" : m.kind; note = edits; }
          else { kind = a ? "moved_out" : "moved_in"; note = `${a ? "→" : "←"} ${lineLabel(rep, m[other].line)}${edits ? "; " + edits : ""}`; }
        } else kind = a ? "removed" : "added";
      }
      const f0 = oldTrip ? firstTime(oldTrip.times) : null, f1 = newTrip ? firstTime(newTrip.times) : null;
      rows.push({ dir: sortDir, dt: t.day_type, kind, f0, f1, l0: oldTrip ? lastTime(oldTrip.times) : null, l1: newTrip ? lastTime(newTrip.times) : null, note });
    }
  }
  rows.sort((p, q) => p.dir.localeCompare(q.dir) || DAYS.indexOf(p.dt) - DAYS.indexOf(q.dt) || ((p.f0 ?? p.f1) - (q.f0 ?? q.f1)));
  return rows;
}

function lineBlock(rep, line) {
  const open = state.openLines.has(line.key);
  const perDay = {};
  line.trips.forEach(x => Object.values(x.bands).forEach(c => { const d = perDay[x.day_type] || (perDay[x.day_type] = [0, 0]); d[0] += c.before; d[1] += c.after; }));
  const tot = DAYS.filter(d => perDay[d]).map(d => `${rt("dt")[d]} ${perDay[d][0]}→${perDay[d][1]}`).join(" · ");
  let inner = "";
  if (open) {
    const changes = tripChanges(rep, line);
    const cls = { added: "up", removed: "down", moved_out: "down", moved_in: "up" };
    const changeTable = changes.length ? `<div><h3>${esc(rt("tripChanges"))} <small>${changes.length}</small></h3><div class="scroll" style="border:0"><table class="mini">
      <thead><tr>${rt("tcCols").map((c, i) => `<th${i >= 3 && i <= 7 ? ' class="r"' : ""}>${esc(c)}</th>`).join("")}</tr></thead><tbody>${changes.map(r => {
        const d = r.f0 != null && r.f1 != null ? r.f1 - r.f0 : null;
        return `<tr><td>${esc(dirLabel(rep, line, r.dir))}</td><td>${esc(rt("dt")[r.dt])}</td><td class="${cls[r.kind] || ""}">${esc(rt("tk")[r.kind])}</td>
          <td class="r">${hm(r.f0)}</td><td class="r">${hm(r.f1)}</td><td class="r ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d == null ? "" : signed(d)}</td>
          <td class="r">${hm(r.l0)}</td><td class="r">${hm(r.l1)}</td><td>${esc(r.note)}</td></tr>`;
      }).join("")}</tbody></table></div><p class="hint">${esc(rt("tcNote"))}</p></div>` : "";
    const bands = [...new Set(line.trips.flatMap(x => Object.keys(x.bands)))].sort();
    const hourRows = line.trips.slice().sort((p, q) => p.direction.localeCompare(q.direction) || DAYS.indexOf(p.day_type) - DAYS.indexOf(q.day_type));
    const hourTable = bands.length ? `<div><h3>${esc(rt("byHour"))}</h3><div class="scroll"><table class="tt"><thead><tr><th class="pl"></th>${bands.map(b => `<th>${esc(b.replace(/^0/, "").replace("-0", "-"))}</th>`).join("")}</tr></thead><tbody>${
      hourRows.map(x => `<tr><td class="pl" title="${esc(dirLabel(rep, line, x.direction))}">${esc(dirLabel(rep, line, x.direction))} · ${esc(rt("dt")[x.day_type])}</td>${bands.map(b => {
        const c = x.bands[b]; if (!c) return "<td></td>";
        return c.before === c.after ? `<td>${c.after}</td>` : `<td class="chg"><b>${c.after}</b> <s>${c.before}</s></td>`;
      }).join("")}</tr>`).join("")}</tbody></table></div></div>` : "";
    const fl = line.first_last.length ? `<div><h3>${esc(rt("firstLast"))}</h3><table class="mini"><thead><tr><th>${esc(rt("dir"))}</th><th></th><th class="r">${esc(rt("first"))}</th><th class="r">${esc(rt("last"))}</th></tr></thead><tbody>${
      line.first_last.map(x => {
        const cell = c => c.before === c.after ? hm(c.after) : `<b>${hm(c.after) || "—"}</b> <s>${hm(c.before) || "—"}</s>`;
        return `<tr><td>${esc(dirLabel(rep, line, x.direction))}</td><td>${esc(rt("dt")[x.day_type])}</td><td class="r">${cell(x.first)}</td><td class="r">${cell(x.last)}</td></tr>`;
      }).join("")}</tbody></table></div>` : "";
    // Same-named places in one pattern's edits are different poles; show their stop_id to tell them apart.
    const editName = (p, i) => {
      const names = p.edits.flatMap(e => e.places).map(j => pname(rep, j));
      const dup = names.filter(n => n === pname(rep, i)).length > 1;
      const pl = rep.places[i], sid = (pl.new || pl.old).stop_id;

    };
    const moves = rep.moves.filter(m => m.old.line !== m.new.line && (m.old.line === line.key || m.new.line === line.key));
    const moveNote = moves.length ? `<p class="hint">${esc(rt("movesNote", moves.length, [...new Set(moves.map(m => lineLabel(rep, m.old.line === line.key ? m.new.line : m.old.line)))].join(", ")))}</p>` : "";
    const pat = line.patterns.length || moves.length ? `<div><h3>${esc(rt("patterns"))}</h3>${line.patterns.map(p => `<p class="hint">${esc(dirLabel(rep, line, p.direction))}</p><ul class="edits">${
      p.edits.map(e => `<li>${esc(rt("ek")[e.kind])}: ${esc(e.places.map(i => editName(p, i)).join(" → "))}${e.trips ? ` <span class="hint">· ${esc(rt("editTrips", e.trips))}</span>` : ` <span class="hint">· ${esc(rt("editDominant"))}</span>`}</li>`).join("")}</ul>`).join("")}${moveNote}</div>` : "";
    let tts = "";
    if (line.timetables.length) {
      const sel = state.tt[line.key] || { i: 0, view: "diff" };
      const tab = line.timetables[Math.min(sel.i, line.timetables.length - 1)];
      const choices = line.timetables.map((x, i) => `<button type="button" data-line="${esc(line.key)}" data-tt="${i}" aria-pressed="${i === sel.i}">${esc(dirLabel(rep, line, x.direction))} · ${esc(rt("dt")[x.day_type])}</button>`).join("");
      const views = [["old", "vOld"], ["new", "vNew"], ["diff", "vDiff"]].map(([v, k]) => `<button type="button" data-line="${esc(line.key)}" data-view="${v}" aria-pressed="${v === sel.view}">${esc(rt(k))}</button>`).join("");
      tts = `<div><h3>${esc(rt("timetables"))}</h3><div class="ttbar"><div class="seg">${choices}</div><div class="seg">${views}</div></div>
        ${sel.view === "diff" ? `<p class="hint">${esc(rt("ttLegend"))}</p>` : ""}${ttHtml(rep, tab, sel.view)}<p class="hint">${esc(rt("ttUnchanged"))}</p></div>`;
    }
    inner = `<div class="lb">${changeTable}${pat}${fl}${hourTable}${tts}</div>`;
  }
  return `<details class="line" data-key="${esc(line.key)}"${open ? " open" : ""}><summary>${stChip(line.status, rt("ls")[line.status])}<span class="ln">${esc(lineNames(line))}</span><span class="lt">${esc(tot)}</span></summary>${inner}</details>`;
}

function bindLine(rep, el) {

function redrawLine(rep, k) {

  if (!line || !old) return;

}

function pubBox(label, p) {

// ---- Stop change map: static GSI tiles (地理院タイル) with an SVG overlay, no map library. ----
const TILE = 256, GSI = (z, x, y) => `https://cyberjapandata.gsi.go.jp/xyz/pale/${z}/${x}/${y}.png`;
const wx = (lon, z) => (lon + 180) / 360 * TILE * 2 ** z;
const wy = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * TILE * 2 ** z; };
const MAP_COLOR = { added: "var(--good)", removed: "var(--bad)", renamed: "var(--warn)", moved: "var(--warn)", renamed_moved: "var(--warn)", unchanged: "var(--faint)" };

function mapPoints(rep) {
  return rep.places.map((p, i) => ({ i, p, a: p.old && p.old.lat != null && p.old.lon != null ? p.old : null, b: p.new && p.new.lat != null && p.new.lon != null ? p.new : null }))
    .filter(x => x.a || x.b);
}
function initMap(rep) {
  const el = $("pmap");
  if (!el) return;
  const pts = mapPoints(rep), changed = pts.filter(x => x.p.status !== "unchanged");
  if (!changed.length) { el.outerHTML = `<p class="hint">${esc(rt("mapNoCoords"))}</p>`; return; }
  const view = { z: 16, lat: 0, lon: 0, focus: null };
  const fit = () => {
    const c = changed.flatMap(x => [x.a, x.b].filter(Boolean));
    const lats = c.map(s => s.lat), lons = c.map(s => s.lon);
    const W = el.clientWidth - 40, H = el.clientHeight - 40;
    let z = 17;
    while (z > 5 && (wx(Math.max(...lons), z) - wx(Math.min(...lons), z) > W || wy(Math.min(...lats), z) - wy(Math.max(...lats), z) > H)) z--;
    Object.assign(view, { z, lat: (Math.max(...lats) + Math.min(...lats)) / 2, lon: (Math.max(...lons) + Math.min(...lons)) / 2, focus: null });
  };
  const draw = () => {
    const W = el.clientWidth, H = el.clientHeight, z = view.z;
    const cx = wx(view.lon, z), cy = wy(view.lat, z), x0 = cx - W / 2, y0 = cy - H / 2, n = 2 ** z;
    let tiles = "";
    for (let tx = Math.floor(x0 / TILE); tx <= Math.floor((x0 + W) / TILE); tx++)
      for (let ty = Math.floor(y0 / TILE); ty <= Math.floor((y0 + H) / TILE); ty++)
        if (ty >= 0 && ty < n) tiles += `<img alt="" draggable="false" src="${GSI(z, ((tx % n) + n) % n, ty)}" style="left:${Math.round(tx * TILE - x0)}px;top:${Math.round(ty * TILE - y0)}px" onerror="this.remove()">`;
    const P = s => [wx(s.lon, z) - x0, wy(s.lat, z) - y0];
    const dot = (s, x, r) => { const [px, py] = P(s); return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}" fill="${MAP_COLOR[x.p.status]}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(s.name)} (${esc(s.stop_id)}) · ${esc(rt("ps")[x.p.status])}</title></circle>`; };
    let svg = pts.filter(x => x.p.status === "unchanged").map(x => dot(x.b || x.a, x, 3)).join("");
    for (const x of changed) {
      if (x.a && x.b && (x.p.status === "moved" || x.p.status === "renamed_moved")) {
        const [ax, ay] = P(x.a), [bx, by] = P(x.b);
        svg += `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>`;
        svg += dot(x.a, { p: { status: "removed" } }, 4).replace(rt("ps").removed, rt("ps")[x.p.status]);
      }
      svg += dot(x.b || x.a, x, 6);
      if (view.focus === x.i) { const [fx, fy] = P(x.b || x.a); svg += `<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="12" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`; }
    }
    el.querySelector(".tiles").innerHTML = tiles;
    el.querySelector("svg").innerHTML = svg;
    el.querySelector("svg").setAttribute("viewBox", `0 0 ${W} ${H}`);
  };
  // Drag to pan.
  let drag = null;
  el.addEventListener("pointerdown", e => { if (e.target.closest(".mapctl")) return; drag = { x: e.clientX, y: e.clientY, cx: wx(view.lon, view.z), cy: wy(view.lat, view.z) }; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => {
    if (!drag) return;
    const n = TILE * 2 ** view.z, x = drag.cx - (e.clientX - drag.x), y = drag.cy - (e.clientY - drag.y);
    view.lon = x / n * 360 - 180;
    view.lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI;
    requestAnimationFrame(draw);
  });
  el.addEventListener("pointerup", () => { drag = null; });
  el.querySelector("[data-z='+']").addEventListener("click", () => { view.z = Math.min(18, view.z + 1); draw(); });
  el.querySelector("[data-z='-']").addEventListener("click", () => { view.z = Math.max(5, view.z - 1); draw(); });
  el.querySelector("[data-z='all']").addEventListener("click", () => { fit(); draw(); });
  document.querySelectorAll("#reports tr[data-place]").forEach(tr => tr.addEventListener("click", () => {
    const x = pts.find(q => q.i === +tr.dataset.place);
    if (!x) return;
    const s = x.b || x.a;
    Object.assign(view, { z: 17, lat: s.lat, lon: s.lon, focus: x.i });
    draw();
    el.scrollIntoView({ block: "nearest" });
  }));
  fit(); draw();
}

      <p class="hint">${esc(rt("periods"))} · ${esc(rt("old"))}: ${esc(periods("old") || "—")}<br>${esc(rt("periods"))} · ${esc(rt("new"))}: ${esc(periods("new") || "—")}</p>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const key = f => `${f.org_id}/${f.feed_id}`;
const prefName = id => (id >= 1 && id <= 47) ? (state.lang === "ja" ? PREFS[id - 1][0] : PREFS[id - 1][1]) : "—";

// One-decimal arithmetic matching the pipeline (exact difference, halves away from zero).
const round1 = x => { const s = Math.sign(x), a = Math.abs(x); return s * Math.round(a * 10 + 1e-9) / 10; };
const delta1 = (b, a) => round1((Math.round(a * 10) - Math.round(b * 10)) / 10);
const fmt1 = x => x.toFixed(1);
const signed = (x, digits) => (x > 0 ? "+" : x < 0 ? "−" : "±") + (digits ? Math.abs(x).toFixed(digits) : Math.abs(x).toLocaleString());

function scoreClass(v) { return v == null ? "b-none" : v >= 95 ? "b-good" : v >= 85 ? "b-warn" : "b-bad"; }
function contentKey(g) { return JSON.stringify([g.scores, g.metrics, g.rules]); }

// Groups of generations: each COMPLETE/PARTIAL generation, or a run of identical ones when merging.
function groups(feed) {
  const out = [];
  for (const g of feed.generations) {
    const last = out[out.length - 1];
    const same = g.equivalent_to_previous !== undefined ? g.equivalent_to_previous : (g.scores && last && last.rep.scores && contentKey(g) === contentKey(last.rep));
    if (state.merge && last && same) {
      last.members.push(g); last.rep = g; continue;
    }
    out.push({ rep: g, members: [g] });
  }
  return out;
}
function currentIndex(gs) {
  let idx = -1;
  gs.forEach((gr, i) => { if (gr.members.some(m => m.rid === "current")) idx = i; });
  if (idx >= 0) return idx;
  for (let i = gs.length - 1; i >= 0; i--) if (!gs[i].members.every(m => m.rid && m.rid.startsWith("next_"))) return i;
  return gs.length - 1;
}
const upcoming = gs => gs.filter(gr => gr.members.every(m => m.rid && m.rid.startsWith("next_"))).length;

function diff(a, b) {
  const rules = { new: [], increased: [], decreased: [], fixed: [], same: [] };
  const ids = new Set([...Object.keys(a.rules || {}), ...Object.keys(b.rules || {})]);
  [...ids].sort().forEach(id => {
    const x = (a.rules[id] || [0])[0], y = (b.rules[id] || [0])[0];
    const sev = (b.rules[id] || a.rules[id])[1];
    const bucket = x > 0 && y === 0 ? "fixed" : x === 0 && y > 0 ? "new" : y > x ? "increased" : y < x ? "decreased" : "same";
    rules[bucket].push({ id, before: x, after: y, sev });
  });
  const scores = a.scores && b.scores ? Object.fromEntries(SCORES.map(s => [s, delta1(a.scores[s], b.scores[s])])) : null;
  const metrics = a.metrics && b.metrics ? Object.fromEntries(METRICS.map(([m]) => [m, m === "avg_daily_trips" ? delta1(a.metrics[m], b.metrics[m]) : b.metrics[m] - a.metrics[m]])) : null;
  return { scores, metrics, rules };
}

function spark(values, marks = []) {
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 100 26" aria-hidden="true"></svg>`;
  const ys = pts.map(p => p[1]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const n = values.length - 1 || 1;
  const X = i => 2 + (i / n) * 96, Y = v => 23 - ((v - lo) / (hi - lo)) * 20;
  const line = pts.map(([i, v]) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area = `2,24 ${line} ${X(pts[pts.length - 1][0]).toFixed(1)},24`;
  const dots = marks.filter(i => values[i] != null).map(i => `<circle cx="${X(i).toFixed(1)}" cy="${Y(values[i]).toFixed(1)}" r="2.2" fill="var(--spark)"/>`).join("");
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${area}" fill="var(--accent-soft)" stroke="none"/>
    <polyline points="${line}" fill="none" stroke="var(--spark)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>${dots}</svg>`;
}

function genCell(gr, idx, sel, isCurrent) {
  const g = gr.rep;
  const attrs = `class="pickable${sel ? " sel" : ""}" data-new="${idx}"`;
  const date = `<div class="gdate num">${esc(g.from_date)}</div>`;
  const merged = gr.members.length > 1 ? `<span class="merged" title="${esc(t("mergeNote"))}">${esc(t("mergedChip", gr.members.length))}</span>` : "";
  if (!g.scores) return `<td><div class="gcell"><span class="fatal">${esc(t("fatal"))}</span>${date}</div></td>`;
  return `<td ${attrs} title="${esc(t(isCurrent ? "clickCurrent" : "clickGen"))}"><div class="gcell"><div class="pair">
      <span>Publish</span><span class="badge ${scoreClass(g.scores.publish)}">${fmt1(g.scores.publish)}</span>
      <span>Overall</span><span class="badge ${scoreClass(g.scores.overall)}">${fmt1(g.scores.overall)}</span>
    </div>${date}${merged}</div></td>`;
}

function deltaCell(a, b, ia, ib, sel) {
  if (!a || !b) return `<td></td>`;
  if (!a.rep.scores || !b.rep.scores) return `<td class="dcell flat">—</td>`;
  const attrs = `class="dcell pickable${sel ? " sel" : ""}" data-old="${ia}" data-new="${ib}" title="${esc(t("clickDelta"))}"`;
  const d = diff(a.rep, b.rep);
  const lines = [];
  const parts = [["routes", "routes"], ["stops", "stops"], ["trips", "trips"]]
    .filter(([m]) => d.metrics[m] !== 0).map(([m, label]) => `${signed(d.metrics[m])} ${t(label)}`);
  if (parts.length) lines.push(parts.join(" · "));
  if (d.rules.fixed.length) lines.push(t("fixed", d.rules.fixed.length));
  if (d.rules.new.length) lines.push(t("newRules", d.rules.new.length));
  const o = d.scores.overall;
  const cls = o > 0 ? "up" : o < 0 ? "down" : "flat";
  const arrow = o > 0 ? "▲" : o < 0 ? "▼" : "";
  if (!lines.length && o === 0) {
    // Same scores, counts and rules: say "no change" only for truly equivalent publications.
    if (b.rep.equivalent_to_previous && b.members[0] === b.rep) return `<td ${attrs.replace('dcell', 'dcell flat')}>${esc(t("noChange"))}</td>`;
    const extended = a.rep.to_date !== b.rep.to_date ? `<br>${esc(t("validity"))}: ${esc(a.rep.to_date || "…")} → ${esc(b.rep.to_date || "…")}` : "";
    return `<td ${attrs.replace('dcell', 'dcell flat')}>${esc(t("dataUpdated"))}${extended}</td>`;
  }
  return `<td ${attrs}><span class="arrow ${cls}">${arrow} ${o !== 0 ? signed(o, 1) : ""}</span><br>${lines.map(esc).join("<br>")}</td>`;
}

function visibleFeeds() {
  const q = $("q").value.trim().toLowerCase();
  const pref = $("pref").value, pub = $("pub").value, sort = $("sort").value, org = $("org").value, one = $("feedsel").value;
  let list = DATA.feeds.map(f => { const gs = groups(f); const ci = currentIndex(gs); return { f, gs, ci, cur: gs[ci].rep }; });
  list = list.filter(({ f }) => !q || [f.name, f.feed_id, f.org_id, f.organization_name].some(s => (s || "").toLowerCase().includes(q)));
  if (pref) list = list.filter(({ f }) => String(f.pref_id) === pref);
  if (org) list = list.filter(({ f }) => f.org_id === org);
  if (one) list = list.filter(({ f }) => key(f) === one);
  if (!$("showdisc").checked) list = list.filter(({ f }) => !f.is_discontinued);
  if (pub) list = list.filter(({ cur }) => String(!!cur.publishable) === pub);
  const lastPub = x => x.f.generations[x.f.generations.length - 1].published_at || "";
  const ov = x => x.cur.scores ? x.cur.scores.overall : -1;
  const sorters = { recent: (a, b) => lastPub(b).localeCompare(lastPub(a)), name: (a, b) => a.f.name.localeCompare(b.f.name, "ja"),
    low: (a, b) => ov(a) - ov(b), high: (a, b) => ov(b) - ov(a) };
  return list.sort(sorters[sort] || sorters.recent);
}

function feedRow({ f, gs, ci }, child) {
  const isSel = key(f) === state.selected;
  const idxs = [ci, ci - 1, ci - 2, ci - 3];  // newest first
  const series = gs.map(gr => gr.rep.scores ? gr.rep.scores.overall : null);
  const up = upcoming(gs);
  const cells = [];
  idxs.forEach((i, n) => {
    if (n > 0) {
      const newer = idxs[n - 1], older = i;
      const sel = isSel && state.oldIdx === older && state.newIdx === newer;
      cells.push(older >= 0 ? deltaCell(gs[older], gs[newer], older, newer, sel) : `<td></td>`);
    }
    const sel = isSel && (state.oldIdx === i || state.newIdx === i);
    cells.push(i >= 0 ? genCell(gs[i], i, sel, i === ci) : `<td></td>`);
  });
  const disc = f.is_discontinued ? `<span class="chip disc">${esc(t("discChip", f.discontinued_date || lastTo(f) || "?"))}</span>` : "";
  const sub = child ? esc(prefName(f.pref_id)) : `${esc(f.organization_name)} · ${esc(prefName(f.pref_id))}`;
  return `<tr class="feed${child ? " child" : ""}${f.is_discontinued ? " disc" : ""}" tabindex="0" data-key="${esc(key(f))}" aria-selected="${isSel}">
    <td><div class="fcell"><div class="fname">${esc(f.name)}</div>
      <div class="fsub">${sub}</div>${disc}
      ${up ? `<button type="button" class="chip next${isSel && state.oldIdx === ci && state.newIdx === gs.length - 1 ? " sel" : ""}" data-old="${ci}" data-new="${gs.length - 1}" title="${esc(t("clickNext"))}">${esc(t("nextChip", up, gs[gs.length - 1].rep.from_date))}</button>` : ""}
      <div style="width:120px">${spark(series.slice(-24))}</div></div></td>${cells.join("")}</tr>`;
}

function renderGrid() {
  const list = visibleFeeds();
  $("count").textContent = t("feeds", list.length);
  if (!state.selected || !list.some(x => key(x.f) === state.selected)) state.selected = list[0] ? key(list[0].f) : null;
  const head = `<thead><tr><th>${esc(t("feed"))}</th>
    <th class="gen now">${esc(t("current"))}</th><th>${t("delta")}</th><th class="gen">${esc(t("prev", 1))}</th><th>${t("delta")}</th>
    <th class="gen">${esc(t("prev", 2))}</th><th>${t("delta")}</th><th class="gen">${esc(t("prev", 3))}</th></tr></thead>`;
  // Organisations with several visible feeds get a collapsible header; the first member's position keeps the sort order.
  const byOrg = new Map();
  list.forEach(x => { if (!byOrg.has(x.f.org_id)) byOrg.set(x.f.org_id, []); byOrg.get(x.f.org_id).push(x); });
  const out = [];
  byOrg.forEach((members, orgId) => {
    if (members.length === 1) { out.push(feedRow(members[0], false)); return; }
    const open = !state.collapsed.has(orgId);
    const active = members.filter(m => !m.f.is_discontinued).length;
    out.push(`<tr class="orghead" data-org="${esc(orgId)}"><td colspan="8"><span class="caret">${open ? "▾" : "▸"}</span>${esc(members[0].f.organization_name)}<span class="n">${esc(t("orgCount", members.length, active))}</span></td></tr>`);
    if (open) members.forEach(m => out.push(feedRow(m, true)));
  });
  $("grid").innerHTML = head + `<tbody>${out.join("")}</tbody>`;
  $("grid").querySelectorAll("tr.orghead").forEach(tr => tr.addEventListener("click", () => {
    const o = tr.dataset.org;
    if (state.collapsed.has(o)) state.collapsed.delete(o); else state.collapsed.add(o);
    renderGrid();
  }));
  $("grid").querySelectorAll("tr.feed").forEach(tr => {
    const pick = () => { state.selected = tr.dataset.key; state.oldIdx = state.newIdx = null; state.showSame = false; renderGrid(); renderPanel(); renderHistory(); renderReport(); };
    tr.addEventListener("click", e => {
      const cell = e.target.closest("td.pickable, button.chip.next");
      if (!cell) return pick();
      const gsNew = +cell.dataset.new;
      const f = DATA.feeds.find(x => key(x) === tr.dataset.key);
      const gs = groups(f);
      const ci = currentIndex(gs);
      let oldIdx, newIdx;
      if (cell.dataset.old != null) { oldIdx = +cell.dataset.old; newIdx = gsNew; }  // Δ cell: the two neighbours
      else if (gsNew !== ci) { oldIdx = gsNew; newIdx = ci; }                       // older publication vs current
      else {                                                                        // current vs the one before
        newIdx = ci; oldIdx = ci;
        for (let i = ci - 1; i >= 0; i--) if (gs[i].rep.scores) { oldIdx = i; break; }
      }
      state.selected = tr.dataset.key; state.newIdx = newIdx; state.oldIdx = oldIdx; state.showSame = false;
      renderGrid(); renderPanel(); renderHistory(); renderReport();
    });
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
}

const lastTo = f => { const ds = f.generations.map(g => g.to_date).filter(Boolean).sort(); return ds[ds.length - 1] || null; };

// Heuristic, shown as "possible": the route count jumps and another feed of the same
// organisation ends around the same time, so routes may have moved between feeds.
function scopeNote(f, a, b) {
  if (!a.metrics || !b.metrics) return "";
  const dr = b.metrics.routes - a.metrics.routes;
  if (Math.abs(dr) < 2 && !(a.metrics.routes && Math.abs(dr) / a.metrics.routes >= 0.5)) return "";
  const lo = a.from_date, hi = b.to_date || b.from_date;
  const ended = DATA.feeds.filter(o => o.org_id === f.org_id && key(o) !== key(f) && o.is_discontinued)
    .map(o => ({ o, end: o.discontinued_date || lastTo(o) })).filter(x => x.end && x.end >= lo && x.end <= hi);
  if (!ended.length) return "";
  return `<p class="fmt">${esc(t("scopeNote", signed(dr), ended.map(x => `${x.o.name} (${x.end})`).join(", ")))}</p>`;
}

function genLabel(gr) {
  const g = gr.rep;
  const range = `${g.from_date} – ${g.to_date || "…"}`;
  const pub = (g.published_at || "").slice(0, 10);
  const memo = (g.memo || "").replace(/\s+/g, " ").slice(0, 28);
  const n = gr.members.length > 1 ? ` ${t("mergedChip", gr.members.length)}` : "";
  return `${range} · ${pub}${memo ? " · " + memo : ""}${n}`;
}

function renderPanel() {
  const panel = $("panel");
  const f = DATA.feeds.find(x => key(x) === state.selected);
  if (!f) { panel.innerHTML = ""; return; }
  const gs = groups(f);
  const ci = currentIndex(gs);
  const usable = gs.map((gr, i) => [gr, i]).filter(([gr]) => gr.rep.scores);
  const up = upcoming(gs);
  if ((state.newIdx == null || state.newIdx >= gs.length) && up && gs[gs.length - 1].rep.scores && gs[ci].rep.scores) {
    state.newIdx = gs.length - 1; state.oldIdx = ci;  // an upcoming timetable is the most useful default
  }
  if (state.newIdx == null || state.newIdx >= gs.length) state.newIdx = gs[ci].rep.scores ? ci : (usable.length ? usable[usable.length - 1][1] : ci);
  if (state.oldIdx == null || state.oldIdx >= gs.length) {
    const before = usable.filter(([, i]) => i < state.newIdx);
    state.oldIdx = before.length ? before[before.length - 1][1] : state.newIdx;
  }
  const cur = gs[ci].rep;
  const options = sel => gs.map((gr, i) => `<option value="${i}" ${i === sel ? "selected" : ""} ${gr.rep.scores ? "" : "disabled"}>${esc(genLabel(gr))}</option>`).join("");
  let lo = state.oldIdx, hi = state.newIdx;
  const backwards = lo > hi;
  const a = gs[lo].rep, b = gs[hi].rep;
  let body;
  if (lo === hi) body = `<p class="hint">${esc(t("sameSide"))}</p>`;
  else {
    const d = diff(a, b);
    const seriesOf = s => gs.map(gr => gr.rep.scores ? gr.rep.scores[s] : null);
    const cards = SCORES.map(s => {
      const dv = d.scores[s];
      const cls = dv > 0 ? "up" : dv < 0 ? "down" : "flat";
      return `<div class="card"><div class="k">${esc(t(s))}</div>
        <div class="v"><span>${fmt1(a.scores[s])} → ${fmt1(b.scores[s])}</span><span class="d ${cls}">${dv > 0 ? "▲" : dv < 0 ? "▼" : ""}${signed(dv, 1)}</span></div>
        ${spark(seriesOf(s), [lo, hi])}</div>`;
    }).join("");
    const metricRows = METRICS.map(([m, label]) => {
      const dv = d.metrics[m];
      const digits = m === "avg_daily_trips" ? 1 : 0;
      const show = v => digits ? fmt1(v) : v.toLocaleString();
      return `<tr><td>${esc(t(label))}</td><td class="r">${show(a.metrics[m])}</td><td class="r">${show(b.metrics[m])}</td>
        <td class="r ${dv > 0 ? "up" : dv < 0 ? "down" : "flat"}">${signed(dv, digits)}</td></tr>`;
    }).join("");
    const titles = DATA.rule_titles[state.lang] || {};
    const bucketRows = [["new", "bNew"], ["increased", "bIncreased"], ["decreased", "bDecreased"], ["fixed", "bFixed"]]
      .filter(([k]) => d.rules[k].length).map(([k, label]) => `<tr class="bucket"><td colspan="5">${esc(t(label))} · ${d.rules[k].length}</td></tr>` +
        d.rules[k].map(r => ruleRow(r, titles)).join("")).join("");
    const same = d.rules.same;
    const sameRows = state.showSame && same.length ? same.map(r => ruleRow(r, titles)).join("") : "";
    const ruleTable = bucketRows || sameRows ? `<div class="scroll" style="border:0"><table class="mini"><thead><tr><th>${esc(t("rule"))}</th><th>${esc(t("title"))}</th>
        <th class="r">${esc(t("before"))}</th><th class="r">${esc(t("after"))}</th><th class="r">Δ</th></tr></thead><tbody>${bucketRows}${sameRows}</tbody></table></div>`
      : `<p class="hint">${esc(t("noRuleChange"))}</p>`;
    const sameBtn = same.length ? `<button type="button" class="linkbtn" id="toggle-same">${esc(state.showSame ? t("hideSame") : t("showSame", same.length))}</button>` : "";
    const fa = (a.jp_files || []).join(", "), fb = (b.jp_files || []).join(", ");
    const fmtNote = (fa !== fb ? `<p class="fmt">${esc(t("formatDiff", fa || "—", fb || "—"))}</p>` : "") + scopeNote(f, a, b);
    body = `${backwards ? `<p class="hint">${esc(t("backwards"))}</p>` : ""}${fmtNote}
      <div><h3>1. ${esc(t("s1"))}</h3><div class="cards">${cards}</div></div>
      <div><h3>2. ${esc(t("s2"))}</h3><table class="mini"><thead><tr><th></th><th class="r">${esc(t("before"))}</th><th class="r">${esc(t("after"))}</th><th class="r">Δ</th></tr></thead><tbody>${metricRows}</tbody></table></div>
      <div><h3>3. ${esc(t("s3"))}</h3>${ruleTable}${sameBtn}</div>
      <div><h3>4. ${esc(t("s4"))}</h3>${panelSemantic()}</div>`;
  }
  panel.innerHTML = `<div class="ph"><h2>${esc(f.name)}</h2>
      <div class="meta"><span>${esc(f.organization_name)}</span><span>${esc(prefName(f.pref_id))}</span><span>${esc(t("license"))}: ${esc(f.license)}</span></div>
      <div class="meta"><span>${esc(t("lastPub"))}: <span class="num">${esc((f.generations[f.generations.length - 1].published_at || "").slice(0, 16).replace("T", " "))}</span> JST</span></div>
      ${cur.scores ? `<span class="state ${cur.publishable ? "ok" : "no"}">${cur.publishable ? "●" : "○"} ${esc(cur.publishable ? t("ready") : t("notReady"))}</span>` : ""}
    </div>
    <div><h3>${esc(t("compare"))}</h3><p class="hint">${esc(t("compareHint"))}</p></div>
    <div class="pick">
      <div class="field"><label for="old-pick">${esc(t("pickOld"))}</label><select id="old-pick">${options(state.oldIdx)}</select></div>
      <span class="to">→</span>
      <div class="field"><label for="new-pick">${esc(t("pickNew"))}</label><select id="new-pick">${options(state.newIdx)}</select></div>
    </div>${body}`;
  $("old-pick").addEventListener("change", e => { state.oldIdx = +e.target.value; renderPanel(); renderReport(); });
  $("new-pick").addEventListener("change", e => { state.newIdx = +e.target.value; renderPanel(); renderReport(); });
  const openBtn = $("open-report");
  if (openBtn) openBtn.addEventListener("click", () => { state.tab = "reports"; renderStatic(); renderReport(); window.scrollTo(0, 0); });
  const btn = $("toggle-same");
  if (btn) btn.addEventListener("click", () => { state.showSame = !state.showSame; renderPanel(); });
}

function ruleRow(r, titles) {
  const dv = r.after - r.before;
  return `<tr><td class="num">${esc(r.id)}<br><span class="sev sev-${esc(r.sev)}">${esc(r.sev)}</span></td><td>${esc(titles[r.id] || "")}</td>
    <td class="r">${r.before}</td><td class="r">${r.after}</td><td class="r ${dv < 0 ? "up" : dv > 0 ? "down" : "flat"}">${signed(dv)}</td></tr>`;
}

function renderHistory() {
  const f = DATA.feeds.find(x => key(x) === state.selected);
  if (!f) { $("history").innerHTML = ""; return; }
  const gs = groups(f);
  const rows = gs.slice().reverse().map(gr => {
    const g = gr.rep, first = gr.members[0];
    const rids = [...new Set(gr.members.map(m => m.rid).filter(Boolean))].join(", ");
    const pubs = gr.members.length > 1 ? `${(first.published_at || "").slice(0, 10)} … ${(g.published_at || "").slice(0, 10)}` : (g.published_at || "").slice(0, 10);
    return `<tr><td class="num">${esc(g.from_date)} – ${esc(g.to_date || "…")}</td><td class="num">${esc(pubs)}${gr.members.length > 1 ? ` <span class="merged">${esc(t("mergedChip", gr.members.length))}</span>` : ""}</td>
      <td>${esc(g.status)}</td><td class="r">${g.scores ? fmt1(g.scores.publish) : "—"}</td><td class="r">${g.scores ? fmt1(g.scores.overall) : "—"}</td>
      <td class="num">${esc(rids)}</td><td class="num">${esc((g.jp_files || []).map(n => n.replace(".txt", "")).join(", ") || "—")}</td><td>${esc((g.memo || "").replace(/\s+/g, " ").slice(0, 80))}</td></tr>`;
  }).join("");
  $("history").innerHTML = `<h3>${esc(f.name)} <small>${esc(f.org_id)}/${esc(f.feed_id)}</small></h3><p class="hint">${esc(t("histIntro"))}</p>
    <div class="scroll" style="border:0"><table class="mini"><thead><tr><th>${esc(t("period"))}</th><th>${esc(t("published"))}</th><th>${esc(t("status"))}</th>
    <th class="r">Publish</th><th class="r">Overall</th><th>${esc(t("rid"))}</th><th>${esc(t("jpFiles"))}</th><th>${esc(t("memo"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderStatic() {
  document.documentElement.lang = state.lang;
  $("tagline").textContent = t("tagline");
  const [rel, prof] = (DATA.analysis_key || "").split("__");
  $("notice").innerHTML = `<span>${t("notice", DATA.feeds.length, DATA.feeds.reduce((n, f) => n + f.generations.length, 0), esc(rel || ""), esc(prof || ""))}</span>`;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("nav.tabs button").forEach(b => { b.textContent = t(b.dataset.tab); b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  ["overview", "history", "reports", "gtfsjp"].forEach(id => { $("tab-" + id).hidden = id !== state.tab; });
  const prefSel = $("pref"), pv = prefSel.value;
  const prefs = [...new Set(DATA.feeds.map(f => f.pref_id).filter(Boolean))].sort((a, b) => a - b);
  prefSel.innerHTML = `<option value="">${esc(t("all"))}</option>` + prefs.map(p => `<option value="${p}">${esc(prefName(p))}</option>`).join("");
  prefSel.value = pv;
  const orgSel = $("org"), ov = orgSel.value;
  const orgs = new Map();
  DATA.feeds.filter(f => !prefSel.value || String(f.pref_id) === prefSel.value).forEach(f => orgs.set(f.org_id, f.organization_name));
  orgSel.innerHTML = `<option value="">${esc(t("all"))}</option>` + [...orgs].sort((a, b) => a[1].localeCompare(b[1], "ja"))
    .map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join("");
  orgSel.value = orgs.has(ov) ? ov : "";
  const feedSel = $("feedsel"), fv = feedSel.value;
  const fl = DATA.feeds.filter(f => (!prefSel.value || String(f.pref_id) === prefSel.value) && (!orgSel.value || f.org_id === orgSel.value));
  feedSel.innerHTML = `<option value="">${esc(t("all"))}</option>` + fl.slice().sort((a, b) => a.name.localeCompare(b.name, "ja"))
    .map(f => `<option value="${esc(key(f))}">${esc(orgSel.value ? f.name : `${f.organization_name} — ${f.name}`)}${f.is_discontinued ? " ✕" : ""}</option>`).join("");
  feedSel.value = fl.some(f => key(f) === fv) ? fv : "";
  const pubSel = $("pub"), bv = pubSel.value;
  pubSel.innerHTML = `<option value="">${esc(t("all"))}</option><option value="true">${esc(t("ready"))}</option><option value="false">${esc(t("notReady"))}</option>`;
  pubSel.value = bv;
  const sortSel = $("sort"), sv = sortSel.value || "recent";
  sortSel.innerHTML = [["recent", "sortRecent"], ["name", "sortName"], ["low", "sortLow"], ["high", "sortHigh"]].map(([v, k]) => `<option value="${v}">${esc(t(k))}</option>`).join("");
  sortSel.value = sv;
  const profile = (DATA.analysis_key || "").split("__")[1] || "auto";
  $("gtfsjp").innerHTML = t("gtfsjpText", esc(profile));
  $("footer").textContent = t("footer");
  $("merge-note").textContent = state.merge ? t("mergeNote") : "";
}

function renderAll() { renderStatic(); renderGrid(); renderPanel(); renderHistory(); renderReport(); }

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang;
  try { localStorage.setItem("gjm-lang", state.lang); } catch (e) { /* ignore */ }
  renderAll();
}));
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; renderStatic(); if (state.tab === "reports") renderReport(); }));
["q", "pub", "sort", "showdisc"].forEach(id => $(id).addEventListener("input", () => { renderGrid(); renderPanel(); renderHistory(); renderReport(); }));
["pref", "org", "feedsel"].forEach(id => $(id).addEventListener("change", () => {
  if (id === "pref") { $("org").value = ""; $("feedsel").value = ""; }
  if (id === "org") $("feedsel").value = "";
  if (id === "feedsel" && $("feedsel").value) { state.selected = $("feedsel").value; state.oldIdx = state.newIdx = null; }
  renderAll();
}));
$("merge").addEventListener("change", e => { state.merge = e.target.checked; state.oldIdx = state.newIdx = null; renderAll(); });

renderAll();
})();
</script>
